<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">RoPE 图解：数学一样，pairing layout 可以完全不同</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">RoPE 最容易写错的不是旋转公式，而是“到底哪两个元素构成一对”</text>

  <rect x="60" y="145" width="540" height="280" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">Layout A：interleaved</text>
  <text x="85" y="225" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">相邻两位成对</text>
  <text x="85" y="265" font-size="22" font-family="monospace" fill="#0f172a">[ x0  x1  x2  x3  x4  x5  x6  x7 ]</text>
  <text x="85" y="315" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 0: (x0, x1)</text>
  <text x="85" y="345" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 1: (x2, x3)</text>
  <text x="85" y="375" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 2: (x4, x5)</text>
  <text x="85" y="405" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 3: (x6, x7)</text>

  <rect x="680" y="145" width="540" height="280" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="705" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">Layout B：split-half / rotate-half</text>
  <text x="705" y="225" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">前半和后半成对</text>
  <text x="705" y="265" font-size="22" font-family="monospace" fill="#0f172a">[ x0  x1  x2  x3 | x4  x5  x6  x7 ]</text>
  <text x="705" y="315" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 0: (x0, x4)</text>
  <text x="705" y="345" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 1: (x1, x5)</text>
  <text x="705" y="375" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 2: (x2, x6)</text>
  <text x="705" y="405" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">pair 3: (x3, x7)</text>

  <rect x="60" y="500" width="1160" height="120" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="85" y="540" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#c2410c">同一个旋转公式，pair 不同，结果就不同</text>
  <text x="85" y="580" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">公式都可以写成 (x1, x2) → (x1*cos - x2*sin, x1*sin + x2*cos)，但首先要知道“这里的 x1 和 x2 是哪两个位置”。</text>

  <rect x="60" y="660" width="360" height="120" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="85" y="700" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">最危险的错误</text>
  <text x="85" y="740" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">数学公式对了，layout 假设错了。</text>

  <rect x="460" y="660" width="360" height="120" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="485" y="700" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">最稳妥的做法</text>
  <text x="485" y="740" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">和训练/参考实现逐元素对齐，而不是猜默认 layout。</text>

  <rect x="860" y="660" width="360" height="120" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="885" y="700" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#b91c1c">工程提醒</text>
  <text x="885" y="740" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">cos/sin 的索引步长和 pair 定义必须一起核对。</text>
</svg>
