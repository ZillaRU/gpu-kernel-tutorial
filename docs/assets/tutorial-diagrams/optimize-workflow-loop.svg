<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">Kernel 优化闭环图：Profile → Diagnose → Optimize → Verify → Benchmark</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">这不是线性清单，而是一个带回路的工程流程：任何一步发现问题，都要回到前面重新定位，而不是硬着头皮继续调参</text>

  <circle cx="640" cy="410" r="285" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>

  <rect x="535" y="110" width="210" height="100" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="152" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">1. Profile</text>
  <text x="640" y="182" text-anchor="middle" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">先找最大瓶颈，不凭直觉改</text>

  <rect x="890" y="245" width="220" height="100" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1000" y="287" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">2. Diagnose</text>
  <text x="1000" y="317" text-anchor="middle" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">把信号翻译成瓶颈类型</text>

  <rect x="820" y="560" width="220" height="100" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="930" y="602" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#92400e">3. Optimize</text>
  <text x="930" y="632" text-anchor="middle" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">一次只改一个主点</text>

  <rect x="250" y="560" width="220" height="100" rx="20" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="360" y="602" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#86198f">4. Verify</text>
  <text x="360" y="632" text-anchor="middle" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">先证正确，再谈性能</text>

  <rect x="170" y="245" width="220" height="100" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="280" y="287" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#b91c1c">5. Benchmark</text>
  <text x="280" y="317" text-anchor="middle" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">用一致协议做性能对比</text>

  <path d="M745 160 C865 165, 945 220, 975 245" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1060 345 C1085 420, 1040 520, 985 560" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M820 640 C700 720, 500 720, 410 640" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M250 560 C185 515, 150 400, 220 330" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M355 245 C410 180, 480 155, 535 160" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="465" y="335" width="350" height="150" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="640" y="375" text-anchor="middle" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">中心原则</text>
  <text x="640" y="415" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">错误的 kernel 再快也没价值</text>
  <text x="640" y="445" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">没有证据的调参很难复现，也很难复盘</text>

  <rect x="75" y="705" width="1130" height="70" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="100" y="748" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">任何一步发现“瓶颈判断错了 / 正确性坏了 / benchmark 协议不一致”，都应该回退到前面重新定位，而不是把后续步骤硬做完。</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
