<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">Flash-Attention 结构图：为什么它不需要把 scores / P 写回 HBM</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">核心不是“算得更神秘”，而是把标准 attention 的大中间矩阵变成 tile-by-tile 的在线计算</text>

  <rect x="50" y="130" width="520" height="250" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="75" y="170" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#b91c1c">标准 attention</text>
  <text x="75" y="210" font-size="18" font-family="monospace" fill="#0f172a">scores = Q @ K^T</text>
  <text x="75" y="240" font-size="18" font-family="monospace" fill="#0f172a">P = softmax(scores)</text>
  <text x="75" y="270" font-size="18" font-family="monospace" fill="#0f172a">out = P @ V</text>
  <text x="75" y="320" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">问题：scores / P 都可能是 [N, N] 级别</text>
  <text x="75" y="350" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">序列一长，就会制造巨大的 HBM 往返</text>

  <rect x="700" y="130" width="530" height="250" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="725" y="170" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">Flash-Attention</text>
  <text x="725" y="210" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">固定一个 Q_tile，循环读取很多个 K/V tile</text>
  <text x="725" y="245" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">每一轮只算当前 qk_block，并立刻更新：</text>
  <text x="760" y="280" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- m_i（running max）</text>
  <text x="760" y="308" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- l_i（running exp-sum）</text>
  <text x="760" y="336" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- acc（输出分子累计项）</text>
  <text x="725" y="370" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">因此不会把完整 scores / P 落回 HBM</text>

  <rect x="70" y="470" width="240" height="180" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="145" y="505" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#1d4ed8">Q_tile</text>
  <text x="145" y="545" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">固定在片上</text>
  <text x="145" y="575" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">当前外层循环对象</text>

  <rect x="390" y="430" width="220" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="485" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#92400e">K_tile #0</text>
  <rect x="390" y="545" width="220" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="600" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#92400e">K_tile #1</text>
  <rect x="390" y="660" width="220" height="90" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="715" font-size="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#92400e">K_tile #2 ...</text>

  <rect x="690" y="470" width="250" height="180" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="815" y="505" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#15803d">在线状态</text>
  <text x="815" y="545" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">m_i：最大值</text>
  <text x="815" y="575" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">l_i：归一化分母</text>
  <text x="815" y="605" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">acc：输出分子累计项</text>

  <rect x="1010" y="470" width="220" height="180" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="1120" y="505" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#86198f">最终输出</text>
  <text x="1120" y="555" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">out = acc / l_i</text>
  <text x="1120" y="585" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1e293b">只在最后归一化</text>

  <path d="M310 560 L390 560" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 560 L690 560" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M940 560 L1010 560" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 475 C660 455, 660 455, 690 500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 590 C660 600, 660 600, 690 585" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M610 705 C660 725, 660 725, 690 620" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
