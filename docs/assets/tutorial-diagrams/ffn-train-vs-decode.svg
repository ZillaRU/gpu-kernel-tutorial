<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860">
  <rect width="1440" height="860" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">FFN 图解：训练与推理 decode 为什么是两种不同问题</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">同样都是 FFN，但 batch / M 维规模一变，主瓶颈会从 compute 向 memory / latency 快速切换</text>

  <rect x="60" y="145" width="540" height="300" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">训练场景</text>
  <text x="85" y="225" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">典型特征：</text>
  <text x="125" y="260" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- batch 大</text>
  <text x="125" y="290" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- M 维大</text>
  <text x="125" y="320" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- GEMM 足够大，矩阵路径更容易吃满</text>
  <text x="125" y="350" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- FFN 常更像 compute-bound</text>
  <text x="85" y="395" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">更值钱的方向：</text>
  <text x="125" y="430" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">tile 形状 / Tensor Core / MFMA / inner-loop / fusion 质量</text>

  <rect x="680" y="145" width="540" height="300" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="705" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#b91c1c">推理 decode 场景</text>
  <text x="705" y="225" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">典型特征：</text>
  <text x="745" y="260" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- batch 小</text>
  <text x="745" y="290" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- M 可能接近 1</text>
  <text x="745" y="320" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- 权重读取成本相对更重</text>
  <text x="745" y="350" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- 很容易变成 memory-bound / latency-bound</text>
  <text x="705" y="395" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">更值钱的方向：</text>
  <text x="745" y="430" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">量化 / 减少流量 / 减少 launch / grouped / persistent</text>

  <rect x="60" y="510" width="1160" height="130" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="85" y="550" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#c2410c">同一个 FFN，为什么阶段变了，优化优先级也会变？</text>
  <text x="85" y="590" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">因为训练时算术量随着 batch / M 增大得更快，矩阵乘更像主角；而 decode 时算术量缩小得比权重读取更快，所以带宽与 launch 开销更容易支配整体延迟。</text>

  <rect x="60" y="690" width="360" height="125" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="85" y="730" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">训练时先问</text>
  <text x="85" y="770" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">矩阵路径吃满了吗？tile 合理吗？</text>

  <rect x="460" y="690" width="360" height="125" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="485" y="730" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">decode 时先问</text>
  <text x="485" y="770" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">有没有在反复搬权重？launch 太碎吗？</text>

  <rect x="860" y="690" width="360" height="125" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="885" y="730" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#b91c1c">一句话总结</text>
  <text x="885" y="770" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">FFN 不是一个问题，而是一类会随阶段切换主瓶颈的问题。</text>
</svg>
