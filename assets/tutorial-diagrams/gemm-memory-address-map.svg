<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <rect width="1440" height="760" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">GEMM 地址表达图：从 offs 到 ptrs</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">帮助你看懂为什么 stride 方向不能写反，以及 a_ptrs / b_ptrs 到底是在表达哪两个二维子块</text>

  <rect x="50" y="130" width="540" height="260" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="75" y="170" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">A 的子块地址</text>
  <text x="75" y="210" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">目标子块 shape： [BLOCK_M, BLOCK_K]</text>
  <text x="75" y="245" font-size="18" font-family="monospace" fill="#0f172a">a_ptrs = A + offs_m[:, None] * stride_am</text>
  <text x="150" y="273" font-size="18" font-family="monospace" fill="#0f172a">      + (k0 + offs_k[None, :]) * stride_ak</text>
  <text x="75" y="320" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">行方向：offs_m 乘 stride_am → 沿 M 维走</text>
  <text x="75" y="350" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">列方向：k0 + offs_k 乘 stride_ak → 沿 K 维走</text>

  <rect x="610" y="130" width="620" height="260" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="635" y="170" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">B 的子块地址</text>
  <text x="635" y="210" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">目标子块 shape： [BLOCK_K, BLOCK_N]</text>
  <text x="635" y="245" font-size="18" font-family="monospace" fill="#0f172a">b_ptrs = B + (k0 + offs_k[:, None]) * stride_bk</text>
  <text x="760" y="273" font-size="18" font-family="monospace" fill="#0f172a">      + offs_n[None, :] * stride_bn</text>
  <text x="635" y="320" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">行方向：k0 + offs_k 乘 stride_bk → 沿 K 维走</text>
  <text x="635" y="350" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">列方向：offs_n 乘 stride_bn → 沿 N 维走</text>

  <rect x="50" y="440" width="1180" height="250" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="75" y="480" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#c2410c">最常见错误：把哪一维乘哪个 stride 写反</text>
  <text x="75" y="525" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">正确直觉：</text>
  <text x="115" y="555" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- A 的坐标是 (m, k)，所以地址必须是 m * stride_am + k * stride_ak</text>
  <text x="115" y="585" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- B 的坐标是 (k, n)，所以地址必须是 k * stride_bk + n * stride_bn</text>
  <text x="115" y="615" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">- C 的坐标是 (m, n)，所以地址必须是 m * stride_cm + n * stride_cn</text>
  <text x="75" y="660" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">换句话说：你脑子里先有二维坐标，再把坐标翻译成线性地址；不要先背公式，背到最后把维度顺序背反。</text>
</svg>
