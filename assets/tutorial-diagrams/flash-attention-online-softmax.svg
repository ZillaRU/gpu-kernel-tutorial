<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">Flash-Attention 在线 softmax 状态更新图</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">最容易错的不是公式本身，而是忘了当 max 变大时，旧的 l_i 和 acc 都要同步重标定</text>

  <rect x="60" y="145" width="340" height="220" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">上一轮状态</text>
  <text x="85" y="230" font-size="18" font-family="monospace" fill="#0f172a">m_old</text>
  <text x="85" y="260" font-size="18" font-family="monospace" fill="#0f172a">l_old</text>
  <text x="85" y="290" font-size="18" font-family="monospace" fill="#0f172a">acc_old</text>
  <text x="85" y="335" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">它们都对应“之前已经处理过的 K/V tiles”</text>

  <rect x="470" y="145" width="340" height="220" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="495" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#92400e">当前新块</text>
  <text x="495" y="230" font-size="18" font-family="monospace" fill="#0f172a">qk_block = Q_tile @ K_tile^T</text>
  <text x="495" y="260" font-size="18" font-family="monospace" fill="#0f172a">block_max = max(qk_block)</text>
  <text x="495" y="290" font-size="18" font-family="monospace" fill="#0f172a">p_block = exp(qk_block - m_new)</text>
  <text x="495" y="335" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">这里通常还要先应用 causal mask</text>

  <rect x="880" y="145" width="340" height="220" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="905" y="185" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">更新后的状态</text>
  <text x="905" y="230" font-size="18" font-family="monospace" fill="#0f172a">m_new = max(m_old, block_max)</text>
  <text x="905" y="260" font-size="18" font-family="monospace" fill="#0f172a">alpha = exp(m_old - m_new)</text>
  <text x="905" y="290" font-size="18" font-family="monospace" fill="#0f172a">l_new = alpha*l_old + sum(p_block)</text>
  <text x="905" y="320" font-size="18" font-family="monospace" fill="#0f172a">acc_new = alpha*acc_old + p_block @ V_tile</text>

  <rect x="60" y="450" width="1160" height="290" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="490" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">为什么一定要乘 alpha？</text>
  <text x="85" y="535" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">因为新的最大值 m_new 可能比 m_old 更大。只要最大值变了，旧状态原来使用的指数基准就过时了。</text>
  <text x="85" y="565" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">所以旧的 l_old 和 acc_old 都必须先乘上：</text>
  <text x="125" y="600" font-size="20" font-family="monospace" fill="#0f172a">alpha = exp(m_old - m_new)</text>
  <text x="85" y="645" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">如果你只改 l_i，不改 acc，那么分母和分子就不再处在同一个归一化坐标系里，结果一定错。</text>
  <text x="85" y="690" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">最后一轮结束后，再做：</text>
  <text x="125" y="725" font-size="20" font-family="monospace" fill="#0f172a">out = acc_new / l_new</text>

  <path d="M400 255 L470 255" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 255 L880 255" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
