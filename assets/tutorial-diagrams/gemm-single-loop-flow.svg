<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">GEMM 单次 Triton 循环走读图</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">把一个 program 的一次 k0 迭代拆成：定位输出 tile → 生成 A/B 指针 → load 子块 → dot 累加 → 最终 store</text>

  <rect x="40" y="130" width="270" height="180" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="165" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1e3a8a">① 先定位当前输出 tile</text>
  <text x="60" y="200" font-size="18" font-family="monospace" fill="#1e293b">pid_m = tl.program_id(0)</text>
  <text x="60" y="228" font-size="18" font-family="monospace" fill="#1e293b">pid_n = tl.program_id(1)</text>
  <text x="60" y="266" font-size="18" font-family="monospace" fill="#1e293b">offs_m = pid_m * BM + arange(BM)</text>
  <text x="60" y="294" font-size="18" font-family="monospace" fill="#1e293b">offs_n = pid_n * BN + arange(BN)</text>

  <rect x="360" y="130" width="300" height="180" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="165" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#14532d">② 在当前 k0 上生成指针</text>
  <text x="380" y="202" font-size="18" font-family="monospace" fill="#1e293b">offs_k = arange(BK)</text>
  <text x="380" y="236" font-size="17" font-family="monospace" fill="#1e293b">a_ptrs = A + offs_m[:,None]*stride_am</text>
  <text x="410" y="260" font-size="17" font-family="monospace" fill="#1e293b">+ (k0 + offs_k[None,:]) * stride_ak</text>
  <text x="380" y="294" font-size="17" font-family="monospace" fill="#1e293b">b_ptrs = B + (k0 + offs_k[:,None])*stride_bk</text>
  <text x="410" y="318" font-size="17" font-family="monospace" fill="#1e293b">+ offs_n[None,:] * stride_bn</text>

  <rect x="710" y="130" width="260" height="180" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="730" y="165" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#92400e">③ 取出 A/B 子块</text>
  <text x="730" y="204" font-size="18" font-family="monospace" fill="#1e293b">a = tl.load(a_ptrs, mask=...)</text>
  <text x="730" y="232" font-size="18" font-family="monospace" fill="#1e293b">b = tl.load(b_ptrs, mask=...)</text>
  <text x="730" y="270" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">a 的 shape： [BM, BK]</text>
  <text x="730" y="298" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">b 的 shape： [BK, BN]</text>

  <rect x="1020" y="130" width="220" height="180" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="1040" y="165" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#701a75">④ 做一次 partial GEMM</text>
  <text x="1040" y="215" font-size="18" font-family="monospace" fill="#1e293b">acc += tl.dot(a, b)</text>
  <text x="1040" y="255" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">acc 的 shape 一直是</text>
  <text x="1040" y="283" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">[BM, BN]</text>

  <rect x="40" y="390" width="1200" height="170" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="60" y="425" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">⑤ 单次循环在“空间”和“K 维”上分别在做什么</text>
  <text x="60" y="462" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">空间上不动：当前 program 负责的输出 tile 由 (pid_m, pid_n) 决定，整个 for k0 循环里它不会变。</text>
  <text x="60" y="492" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">K 维在动：每一次 k0 只读取一小段 [k0 : k0+BK]，因此是在不断做 partial reduction。</text>
  <text x="60" y="522" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">也就是说：输出 tile 的位置固定，但贡献这个 tile 数值的 A/B 子块在沿着 K 维窗口滑动。</text>

  <rect x="60" y="605" width="350" height="150" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="640" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">最后写回</text>
  <text x="80" y="680" font-size="18" font-family="monospace" fill="#1e293b">c_ptrs = C + offs_m[:,None]*stride_cm</text>
  <text x="80" y="706" font-size="18" font-family="monospace" fill="#1e293b">      + offs_n[None,:]*stride_cn</text>
  <text x="80" y="734" font-size="18" font-family="monospace" fill="#1e293b">tl.store(c_ptrs, acc, mask=...)</text>

  <rect x="470" y="605" width="330" height="150" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="490" y="640" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">你最该记住的映射</text>
  <text x="490" y="676" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">offs_m / offs_n → C 里的输出坐标</text>
  <text x="490" y="704" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">offs_k / k0 → 当前 K 维小窗口</text>
  <text x="490" y="732" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">acc → 当前输出 tile 的局部累加器</text>

  <rect x="860" y="605" width="360" height="150" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="880" y="640" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#c2410c">一句话总结</text>
  <text x="880" y="676" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">同一个 program 盯着一个固定的 C_tile，</text>
  <text x="880" y="704" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">然后沿 K 维把很多次 A_sub @ B_sub 的结果</text>
  <text x="880" y="732" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">不断累加到 acc 里。</text>

  <path d="M310 220 L360 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 220 L710 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M970 220 L1020 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
