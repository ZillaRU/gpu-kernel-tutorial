<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820">
  <rect width="1440" height="820" fill="#f8fafc"/>
  <text x="50" y="55" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">Cross-Entropy 图解：大 vocab 下的 chunked logsumexp</text>
  <text x="50" y="90" font-size="16" font-family="Arial, Helvetica, sans-serif" fill="#334155">关键不是先写完整 softmax，而是按 chunk 扫描 logits，一边维护 running max / running sum，一边定位 target 值</text>

  <rect x="55" y="145" width="210" height="150" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="185" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">① 读 chunk 0</text>
  <text x="160" y="225" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">logits[0:c]</text>
  <text x="160" y="255" text-anchor="middle" font-size="18" font-family="monospace" fill="#1e293b">m0, s0</text>

  <rect x="305" y="145" width="210" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="185" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">② 读 chunk 1</text>
  <text x="410" y="225" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">logits[c:2c]</text>
  <text x="410" y="255" text-anchor="middle" font-size="18" font-family="monospace" fill="#1e293b">m1, s1</text>

  <rect x="555" y="145" width="210" height="150" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="185" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#92400e">③ 继续扫描</text>
  <text x="660" y="225" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">logits[2c:3c] ...</text>
  <text x="660" y="255" text-anchor="middle" font-size="18" font-family="monospace" fill="#1e293b">running m, running s</text>

  <rect x="805" y="145" width="210" height="150" rx="16" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="910" y="185" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#86198f">④ 记住 target</text>
  <text x="910" y="225" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">如果 target 落在当前 chunk</text>
  <text x="910" y="255" text-anchor="middle" font-size="18" font-family="monospace" fill="#1e293b">target_logit = ...</text>

  <rect x="1055" y="145" width="170" height="150" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1140" y="185" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#b91c1c">⑤ 输出 loss</text>
  <text x="1140" y="225" text-anchor="middle" font-size="18" font-family="monospace" fill="#1e293b">-target + logsumexp</text>

  <path d="M265 220 L305 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M515 220 L555 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M765 220 L805 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1015 220 L1055 220" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="60" y="365" width="1160" height="180" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="85" y="405" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0f172a">running logsumexp 的核心更新</text>
  <text x="85" y="445" font-size="20" font-family="monospace" fill="#0f172a">m_new = max(m_old, max(chunk))</text>
  <text x="85" y="480" font-size="20" font-family="monospace" fill="#0f172a">s_new = exp(m_old - m_new) * s_old + sum(exp(chunk - m_new))</text>
  <text x="85" y="520" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">最后：logsumexp = m_final + log(s_final)</text>

  <rect x="60" y="590" width="360" height="160" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="85" y="630" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1d4ed8">第一直觉</text>
  <text x="85" y="670" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">你最终只需要一个标量 loss，</text>
  <text x="85" y="700" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">并不需要完整概率矩阵。</text>

  <rect x="460" y="590" width="360" height="160" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="485" y="630" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#15803d">第二直觉</text>
  <text x="485" y="670" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">大 vocab 的关键难点是 chunking，</text>
  <text x="485" y="700" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">不是某个“target 索引溢出”的伪问题。</text>

  <rect x="860" y="590" width="360" height="160" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="885" y="630" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#c2410c">第三直觉</text>
  <text x="885" y="670" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">如果 target 在当前 chunk，</text>
  <text x="885" y="700" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">要顺手把 target_logit 抓出来，不必第二遍重扫。</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
